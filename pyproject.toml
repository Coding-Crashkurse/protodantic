[project]
name = "protodantic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sam Betts", email = "1769706+Tehsmash@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "protobuf>=7.34.1",
    "pydantic>=2.12.5",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "googleapis-common-protos>=1.73.1",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
